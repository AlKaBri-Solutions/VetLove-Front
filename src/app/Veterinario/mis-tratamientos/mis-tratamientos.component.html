<section class="seccion--tabla-mascotas seccion visible" id="tabla">
    <h1>
        Hola, <span class="usuario">{{vet.nombre}}</span>
    </h1>


    <div class="contenedor-lo-que-sea">
        <a href="/tratamiento/add-tratamiento?id={{vetId1}}">
            <div tabindex="0" class="plusButton">
                <svg class="plusIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30">
                    <g mask="url(#mask0_21_345)">
                        <path d="M13.75 23.75V16.25H6.25V13.75H13.75V6.25H16.25V13.75H23.75V16.25H16.25V23.75H13.75Z">
                        </path>
                    </g>
                </svg>
            </div>
        </a>

        <div class="container">
            <input type="text" name="text" id="filtro" class="input" required=""
                placeholder="Escribe para encontrar una mascota..." [(ngModel)]="filtro">
            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" class="ionicon" viewBox="0 0 512 512">
                    <title>Search</title>
                    <path d="M221.09 64a157.09 157.09 0 10157.09 157.09A157.1 157.1 0 00221.09 64z" fill="none"
                        stroke="currentColor" stroke-miterlimit="10" stroke-width="32"></path>
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-miterlimit="10"
                        stroke-width="32" d="M338.29 338.29L448 448"></path>
                </svg>
            </div>
        </div>
        <h3>Aqui tus tratamientos pendientes</h3>
    </div>
    <div class="contenedor-tabla">
        <table id="tabla-mascotas-header" class="tabla-mascotas">
            <thead>
                <tr>
                    <th class="row-1-h">Fecha Inicio</th>
                    <th class="row-2-h">Fecha Fin</th>
                    <th class="row-3-h">Nombre Medicamento</th>
                    <th class="row-4-h">Nombre Mascota</th>
                    <th class="row-5-h">Aplicar</th>
                    <th class="row-6-h">Cambiar</th>
                </tr>
            </thead>
        </table>
    </div>
    <div class="contenedor-tabla">
        <ng-container *ngFor="let tratamiento of aplicarFiltro()">
            <table id="tabla-mascotas-body" class="tabla-mascotas">
                <ng-container *ngIf="tratamiento">
                    <tbody>
                        <tr>
                            <td class="row-1-v">{{tratamiento.fechaInicio}}</td>
                            <td class="row-2-v">{{tratamiento.fechaFin}}</td>
                            <td class="row-3-v">{{tratamiento.medicamento.nombre}}</td>
                            <td class="row-4-v">{{tratamiento.mascota.nombre}}</td>
                            <td class="row-5-v">
                                <a>
                                    <button class="needle-button" (click)="aplicarMedicamento(tratamiento)">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" class="needle" viewBox="0 0 24 24"><path fill="currentColor" d="m11.15 15.18l-1.42-1.41l1.42-1.42l1.41 1.42l1.41-1.42l-1.41-1.41l1.41-1.41l1.42 1.41l1.41-1.41l-2.83-2.83l-7.07 7.07l2.83 2.83zM3.08 19l3.12-3.11l-2.12-2.12l9.89-9.9L16.1 6l1.4-1.42l-1.4-1.42l1.4-1.41L21.75 6l-1.41 1.4L18.92 6L17.5 7.4l2.13 2.13l-9.9 9.89l-2.12-2.12l-4.53 4.54z"/></svg>
                                    </button>
                                </a>
                            </td>

                            <td class="row-6-v">
                                <a style="text-decoration: none">
                                    <button class="needle-button" (click)="cambiarMedicamento(tratamiento)">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="switch" viewBox="0 0 24 24"><path fill="currentColor" d="M12 22q-3.575 0-6.325-2.25T2.2 14h2.05q.7 2.65 2.85 4.325T12 20q2.15 0 4-1.062T18.9 16H16v-2h6v6h-2v-2q-1.425 1.9-3.525 2.95T12 22m0-7q-1.25 0-2.125-.875T9 12q0-1.25.875-2.125T12 9q1.25 0 2.125.875T15 12q0 1.25-.875 2.125T12 15M2 10V4h2v2q1.425-1.9 3.525-2.95T12 2q3.575 0 6.325 2.25T21.8 10h-2.05q-.7-2.65-2.85-4.325T12 4Q9.85 4 8 5.063T5.1 8H8v2z"/></svg>
                                    </button>
                                </a>


                            </td>

                        </tr>
                    </tbody>
                </ng-container>
            </table>
        </ng-container>
    </div>
</section>

<app-popup *ngIf="mostrarPopup" [mensaje]="mensajePopup" (cerrar)="cerrarPopup()"></app-popup>
