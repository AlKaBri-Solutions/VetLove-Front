<section class="seccion--tabla-mascotas seccion visible" id="tabla">
    <h1>
        Hola, <span class="usuario">{{vet.nombre}}</span>
    </h1>


    <div class="contenedor-lo-que-sea">
        <a href="/veterinario/add-mascota?id=1">
            <div tabindex="0" class="plusButton">
                <svg class="plusIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30">
                    <g mask="url(#mask0_21_345)">
                        <path d="M13.75 23.75V16.25H6.25V13.75H13.75V6.25H16.25V13.75H23.75V16.25H16.25V23.75H13.75Z">
                        </path>
                    </g>
                </svg>
            </div>
        </a>

        <div class="container">
            <input type="text" name="text" id="filtro" class="input" required=""
                placeholder="Escribe para encontrar una mascota...">
            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" class="ionicon" viewBox="0 0 512 512">
                    <title>Search</title>
                    <path d="M221.09 64a157.09 157.09 0 10157.09 157.09A157.1 157.1 0 00221.09 64z" fill="none"
                        stroke="currentColor" stroke-miterlimit="10" stroke-width="32"></path>
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-miterlimit="10"
                        stroke-width="32" d="M338.29 338.29L448 448"></path>
                </svg>
            </div>
        </div>
        <h3>Estas son tus mascotas registradas</h3>
    </div>
    <div class="contenedor-tabla">
        <table id="tabla-mascotas-header" class="tabla-mascotas">
            <thead>
                <tr>
                    <th class="row-0">Foto</th>
                    <th class="row-1">Nombre</th>
                    <th class="row-2">Raza</th>
                    <th class="row-3">Edad</th>
                    <th class="row-4">Estado</th>
                    <th class="row-5">Detalles</th>
                    <th class="row-6">Eliminar</th>
                </tr>
            </thead>
        </table>
    </div>
    <div class="contenedor-tabla">
        <ng-container *ngFor="let mascota of mascotaList">
            <table id="tabla-mascotas-body" class="tabla-mascotas">
                <ng-container *ngIf="mascota">
                    <tbody>
                        <tr>
                            <td class="row-0">
                                <div><img class="imagen-mascota" src="{{mascota.foto}}"></div>
                            </td>
                            <td class="row-1">{{mascota.nombre}}</td>
                            <td class="row-2">{{mascota.raza}}</td>
                            <td class="row-3">{{mascota.edad}}</td>
                            <td class="row-4">{{mascota.estado.nombre}}</td>
                            <td class="row-4">
                                <a href="/veterinario/update-mascota?id={{vetId1}}&idMascota={{mascota.id}}">
                                    <button class="editBtn">
                                        <svg height="1em" viewBox="0 0 512 512">
                                            <path
                                                d="M410.3 231l11.3-11.3-33.9-33.9-62.1-62.1L291.7 89.8l-11.3 11.3-22.6 22.6L58.6 322.9c-10.4 10.4-18 23.3-22.2 37.4L1 480.7c-2.5 8.4-.2 17.5 6.1 23.7s15.3 8.5 23.7 6.1l120.3-35.4c14.1-4.2 27-11.8 37.4-22.2L387.7 253.7 410.3 231zM160 399.4l-9.1 22.7c-4 3.1-8.5 5.4-13.3 6.9L59.4 452l23-78.1c1.4-4.9 3.8-9.4 6.9-13.3l22.7-9.1v32c0 8.8 7.2 16 16 16h32zM362.7 18.7L348.3 33.2 325.7 55.8 314.3 67.1l33.9 33.9 62.1 62.1 33.9 33.9 11.3-11.3 22.6-22.6 14.5-14.5c25-25 25-65.5 0-90.5L453.3 18.7c-25-25-65.5-25-90.5 0zm-47.4 168l-144 144c-6.2 6.2-16.4 6.2-22.6 0s-6.2-16.4 0-22.6l144-144c6.2-6.2 16.4-6.2 22.6 0s6.2 16.4 0 22.6z"
                                            ></path>
                                        </svg>
                                    </button>
                                </a>
                            </td>

                            <td class="row-6">
                                <a style="text-decoration: none" class="boton-detalles" (click)="confirmarEliminacion(mascota.id)">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 16">
                                        <path fill="currentColor"
                                            d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0" />
                                    </svg>
                                </a>
                            </td>

                        </tr>
                    </tbody>
                </ng-container>
            </table>
        </ng-container>
    </div>
</section>
