              ></path>
            </svg>
          </span>
          <span class="button1-elem">
            <svg viewBox="0 0 46 40">
              <path
                d="M46 20.038c0-.7-.3-1.5-.8-2.1l-16-17c-1.1-1-3.2-1.4-4.4-.3-1.2 1.1-1.2 3.3 0 4.4l11.3 11.9H3c-1.7 0-3 1.3-3 3s1.3 3 3 3h33.1l-11.3 11.9c-1 1-1.2 3.3 0 4.4 1.2 1.1 3.3.8 4.4-.3l16-17c.5-.5.8-1.1.8-1.9z"
              ></path>
            </svg>
          </span>
        </div>
      </button>
    </a>

    <div class="lado-izq">
      <div class="contenedor-titulo">
        <h1 class="titulo-principal">Login</h1>
        <div class="contenedor-animacion">
          <canvas id="canvas" width="250" height="250"></canvas>
        </div>
      </div>
    </div>

    <div class="lado-der">
      <div class="wrapper">
        <div class="card-switch">
            <label class="switch">
              <div class="contenedor-slider"></div>
               <input type="checkbox" class="toggle">
               <span class="slider"></span>
               <span class="card-side"></span>
               <div class="flip-card__inner">
                  <div class="flip-card__front">

                      <button class="flip-card__btn">Entrar</button>

                  </div>

                        <input class="flip-card__input" name="email" placeholder="Cédula" type="text" required [(ngModel)]="txtCedulaVet">
                        <input class="flip-card__input" name="contraseña" placeholder="Password" type="password" required [(ngModel)]="txtPasswordVet">

  <app-popup *ngIf="mostrarPopup" [mensaje]="mensajePopup" (cerrar)="cerrarPopup()"></app-popup>
