<section>
    <div class="flip-card__front">
          <div class="title">Agendar cita</div>
    
        <form id="form-login" class="flip-card__form">
            <input id="id_nombre" class="flip-card__input" placeholder="Fecha" type="date" name="fecha"
            [(ngModel)]="fecha" (change)="onChange($event)">
            
            <div class="tooltip-container">
              <input id="id_peso" class="flip-card__input" placeholder="Correo" type="correo" name="correo" [(ngModel)]="correo">
              <span class="tooltip">Ingresa tu correo</span>
              
            </div>
            <div class="tooltip-container">
    
                <select class="form-select" id="especialidad" name="horario"
                  [(ngModel)]="horario.horario" (change)="onChangeSelect($event)">
                  <option class="form-option" *ngFor="let reserva of reservasXDia" [ngValue]="reserva.hora.horario"
                    name="horario">{{reserva.hora.horario}}</option>
                </select>
                <span class="tooltip">Ingresa la hora</span>
            </div>
    
    
    
          <button class="btn-enviar" type="submit" (click)="agendar(fecha, correo, horario)">
            <div class="svg-wrapper-1">
              <div class="svg-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                  <path fill="none" d="M0 0h24v24H0z"></path>
                  <path fill="currentColor"
                    d="M1.946 9.315c-.522-.174-.527-.455.01-.634l19.087-6.362c.529-.176.832.12.684.638l-5.454 19.086c-.15.529-.455.547-.679.045L12 14l6-8-8 6-8.054-2.685z">
                  </path>
                </svg>
              </div>
            </div>
            <span>Enviar</span>
          </button>
        </form>
      </div>
</section>

<app-popup *ngIf="mostrarPopup" [mensaje]="mensajePopup" (cerrar)="cerrarPopup()"></app-popup>
