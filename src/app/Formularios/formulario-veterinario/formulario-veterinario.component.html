<section>
  <a href="/admin/mis-veterinarios" class="regresar">
    <button class="button1">
      <div class="button1-box">
        <span class="button1-elem">
          <svg viewBox="0 0 46 40" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M46 20.038c0-.7-.3-1.5-.8-2.1l-16-17c-1.1-1-3.2-1.4-4.4-.3-1.2 1.1-1.2 3.3 0 4.4l11.3 11.9H3c-1.7 0-3 1.3-3 3s1.3 3 3 3h33.1l-11.3 11.9c-1 1-1.2 3.3 0 4.4 1.2 1.1 3.3.8 4.4-.3l16-17c.5-.5.8-1.1.8-1.9z">
            </path>
          </svg>
        </span>
        <span class="button1-elem">
          <svg viewBox="0 0 46 40">
            <path
              d="M46 20.038c0-.7-.3-1.5-.8-2.1l-16-17c-1.1-1-3.2-1.4-4.4-.3-1.2 1.1-1.2 3.3 0 4.4l11.3 11.9H3c-1.7 0-3 1.3-3 3s1.3 3 3 3h33.1l-11.3 11.9c-1 1-1.2 3.3 0 4.4 1.2 1.1 3.3.8 4.4-.3l16-17c.5-.5.8-1.1.8-1.9z">
            </path>
          </svg>
        </span>
      </div>
    </button>
  </a>
  <div class="lado-izq">
    <div class="contenedor-titulo">
      <h1 class="titulo-principal">Veterinario</h1>
      <div class="contenedor-animacion">
        <app-animacion-persona></app-animacion-persona>
      </div>
    </div>
  </div>

  <div class="lado-der">
    <div class="flip-card__front">
      <ng-container *ngIf="!esActualizar">
        <div class="title">Registrar Veterinario</div>
      </ng-container>
      <ng-container *ngIf="esActualizar">
        <div class="title">Actualizar Veterinario</div>
      </ng-container>

      <form id="form-login" class="flip-card__form">
        <ng-container *ngIf="!esActualizar">
          <input id="id_dueno" class="flip-card__input" placeholder="Cédula" type="text" name="cedula"
            [(ngModel)]="formVeterinario.cedula">
          <input id="id_nombre" class="flip-card__input" placeholder="Nombre" type="text" name="nombre"
            [(ngModel)]="formVeterinario.nombre">
          <input id="id_raza" class="flip-card__input" placeholder="Contraseña" type="text" name="raza"
            [(ngModel)]="formVeterinario.contrasenia">
          <input id="id_imagen" class="flip-card__input" placeholder="Url imagen" type="text" name="foto"
            [(ngModel)]="formVeterinario.fotoUrl">


        </ng-container>
        <ng-container *ngIf="esActualizar">
          <input id="id_dueno" class="flip-card__input" placeholder="{{formVeterinario.cedula}}" type="text"
            name="cedula" [(ngModel)]="formVeterinario.cedula">
          <input id="id_nombre" class="flip-card__input" placeholder="{{formVeterinario.nombre}}" type="text"
            name="nombre" [(ngModel)]="formVeterinario.nombre">
          <input id="id_raza" class="flip-card__input" placeholder="{{formVeterinario.contrasenia}}" type="text"
            name="raza" [(ngModel)]="formVeterinario.contrasenia">
          <input id="id_imagen" class="flip-card__input" placeholder="{{formVeterinario.fotoUrl}}" type="text"
            name="foto" [(ngModel)]="formVeterinario.fotoUrl">

          <div class="tooltip-container">
            <select class="form-select" id="estado" name="estado" [(ngModel)]="formVeterinario.estado">
              <option class="form-option" *ngFor="let estado of estados" [ngValue]="estado">{{estado.nombre}}</option>
            </select>
            <span class="tooltip">Actual: {{formVeterinario.estado.nombre}}</span>

          </div>

          <div class="tooltip-container">

            <select class="form-select" id="especialidad" name="especialidad"
              [(ngModel)]="formVeterinario.especialidad">
              <option class="form-option" *ngFor="let especialidad of especialidades" [ngValue]="especialidad"
                name="especialidad">{{especialidad.nombre}}</option>
            </select>
            <span class="tooltip">Actual: {{formVeterinario.especialidad.nombre}}</span>

          </div>




        </ng-container>



        <button class="btn-enviar" type="submit" (click)="registrarVeterinario(formVeterinario)">
          <div class="svg-wrapper-1">
            <div class="svg-wrapper">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                <path fill="none" d="M0 0h24v24H0z"></path>
                <path fill="currentColor"
                  d="M1.946 9.315c-.522-.174-.527-.455.01-.634l19.087-6.362c.529-.176.832.12.684.638l-5.454 19.086c-.15.529-.455.547-.679.045L12 14l6-8-8 6-8.054-2.685z">
                </path>
              </svg>
            </div>
          </div>
          <span>Enviar</span>
        </button>
      </form>
    </div>
  </div>

</section>
